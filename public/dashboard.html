</html>
<script>
    invocador_nick.innerHTML = sessionStorage.NICK_USUARIO;

    window.onload = obterDadosGrafico(),buscarTotalInvocador(),buscarTotalTime(),buscarMediaQuiz(),buscarTimeFavorito();

function buscarTotalInvocador() {
    fetch("/medidas/TotalInvocador", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then(function (total){
            total_invocador.innerHTML = `Total de Invocadores<br>${total[0].TotalInvocador}`;
        })
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function buscarTotalTime() {
    fetch("/medidas/TotalTime", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then(function (total){
            total_times.innerHTML = `Total de Times<br>${total[0].TotalTime}`;
        })
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

   function buscarMediaQuiz() {

  function buscarTimeFavorito() {

    })
      .then(function (resposta) {
        resposta.json().then(function (time){
            time_favorito.innerHTML = `Time Favorito<br>${time[0].nome}`;
        })
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }
  
    function obterDadosGrafico(){
        obterDadosGraficoTitulosRegiao();
        obterDadosGraficoTitulosTime();
        obterDadosGraficoTimesFavoritos();
        obterDadosGraficoPontuacoes();
    }

    function obterDadosGraficoTitulosRegiao() {
        fetch(`/medidas/TitulosRegiao`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGraficoTitulosRegiao(resposta);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function obterDadosGraficoTitulosTime() {
        fetch(`/medidas/TitulosTime`, { cache: 'no-store' }).then(function (response) {

            });
    }

    function plotarGraficoTitulosRegiao(resposta) {

        console.log('iniciando plotagem do gráfico...');

        let labelsreg = [];

        const datareg = {
        labels: labelsreg,
        datasets: [
            {
                label: "Títulos Nacionais",
                data: [],
                backgroundColor: '#24737d',
            },
            {
                label: "Títulos Internacionais",
                data: [],
                backgroundColor: '#ab8115',
            }
        ]
    };

console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

// Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labelsreg.push(registro.regiao);
            datareg.datasets[0].data.push(registro.nacionais);
            datareg.datasets[1].data.push(registro.internacionais);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labelsreg)
        console.log('Dados:')
        console.log(datareg.datasets)
        console.log('----------------------------------------------')

    const configreg = {
        type: 'bar',
        data: datareg,
        options: {
            indexAxis: 'y',
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        color: "white"
                    }
                }
            },
            scales: {
                x: {
                    stacked: true,
                    grid: {
                        color: 'rgba(255,255,255,0.1)'
                    },
                    ticks: {
                        color: 'white'
                    }
                },
                y: {
                    stacked: true,
                    grid: {
                        color: 'rgba(255,255,255,0.1)'
                    },
                    ticks: {
                        color: 'white'
                    }
                }
            }
        }
    };
    const regiao = new Chart(
        document.getElementById('regiao'),
        configreg
    );
    }

    }

    function plotarGraficoTimesFavoritos(resposta) {

        console.log('iniciando plotagem do gráfico...');

        let labelstime_fav = [];

        const datatime_fav = {
