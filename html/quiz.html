<script>
    let selecionado1 = false;
    let selecionado2 = false;
    let selecionado3 = false;
    let selecionado4 = false;
    let indice = 1;
    let pontuacao = 0;
    function trocar() {
        op1.style.outline = 'none';
        op2.style.outline = 'none';
        op3.style.outline = 'none';
        op4.style.outline = 'none';

        if (indice == 2) {
            titulo_pergunta.innerHTML = `Pergunta ${indice}`
            pergunta.innerHTML = `Qual foi a equipe campeã do primeiro Worlds de Lol?`
            op1.innerHTML = `SKT`;
            op2.innerHTML = `Fnatic`;
            op3.innerHTML = `EDG`;
            op4.innerHTML = `Team Liquid`;
        } else if (indice == 3) {
            titulo_pergunta.innerHTML = `Pergunta ${indice}`
            pergunta.innerHTML = `Qual foi a equipe campeã do segundo Worlds de Lol?`
            op1.innerHTML = `paiN`;
            op2.innerHTML = `Loud`;
            op3.innerHTML = `SKT`;
            op4.innerHTML = `Rogue`;
        }
    }

    function responder() {
        if (selecionado1 == false && selecionado2 == false && selecionado3 == false && selecionado4 == false) {
            alert(`Selecione uma resposta`)
        } else {
            opc1(true);
            opc2(true);
            opc3(true);
            opc4(true);
            if (indice == 1) {
                op3.style.outline = '5px solid green'
                if(selecionado3){
                    pontuacao++;
                    alert(pontuacao);
                }
            }
            selecionado1 = false;
            selecionado2 = false;
            selecionado3 = false;
            selecionado4 = false;
            indice++;
            setInterval(trocar, 2000);
        }
    }
    function selecionar1() {
        if (selecionado1) {
            opc2(true);
            opc3(true);
            opc4(true);
            selecionado1 = false;
        } else {
            opc2(false);
            opc3(false);
            opc4(false);
            selecionado1 = true;
        }

    }
    function selecionar2() {
        if (selecionado2) {
            opc1(true);
            opc3(true);
            opc4(true);
            selecionado2 = false;
        } else {
            opc1(false);
            opc3(false);
            opc4(false);
            selecionado2 = true;
        }
    }
    function selecionar3() {
        if (selecionado3) {
            opc2(true);
            opc1(true);
            opc4(true);
            selecionado3 = false;
        } else {
            opc2(false);
            opc1(false);
            opc4(false);
            selecionado3 = true;
        }
    }
    function selecionar4() {
        if (selecionado4) {
            opc2(true);
            opc3(true);
            opc1(true);
            selecionado4 = false;
        } else {
            opc2(false);
            opc3(false);
            opc1(false);
            selecionado4 = true;
        }
    }
    function opc1(estado){
        if(estado){
            op1.style.opacity = '100%';
            op1.disabled = false;
        }else{
            op1.style.opacity = '30%';
            op1.disabled = true;
        }
    }
     function opc2(estado){
        if(estado){
            op2.style.opacity = '100%';
            op2.disabled = false;
        }else{
            op2.style.opacity = '30%';
            op2.disabled = true;
        }
    }
     function opc3(estado){
        if(estado){
            op3.style.opacity = '100%';
            op3.disabled = false;
        }else{
            op3.style.opacity = '30%';
            op3.disabled = true;
        }
    }
     function opc4(estado){
        if(estado){
            op4.style.opacity = '100%';
            op4.disabled = false;
        }else{
            op4.style.opacity = '30%';
            op4.disabled = true;
        }
    }
</script>
