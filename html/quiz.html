                </div>
            </div>
        </div>
    </div>
    <hr>
    <div class="conteudo">
        <span id="titulo">Teste seu conhecimento</span>
        <div class="cont_pergunta">
            <span id="titulo_pergunta">1. Blah</span>
            <span id="pergunta">Qual que é não sei</span>
            <div class="opcoes">
                <div class="op" id="op1" onclick="selecionar1()">hhd</div>
                <div class="op" id="op2" onclick="selecionar2()">sdsk</div>
                <div class="op" id="op3" onclick="selecionar3()">sdkj</div>
                <div class="op" id="op4" onclick="selecionar4()">sdnh</div>
            </div>
        </div>
        <div id="confirmar_but" onclick="responder()"></div>
    </div>

<script>
    let selecionado1 = false;
    let selecionado2 = false;
    let selecionado3 = false;
    let selecionado4 = false;
    let indice = 1;
    function trocar() {
        op1.style.border = '3px solid #ab8115'
        op2.style.border = '3px solid #ab8115'
        op3.style.border = '3px solid #ab8115'
        op4.style.border = '3px solid #ab8115'

        if (indice == 2) {
            titulo_pergunta.innerHTML = `Pergunta ${indice}`
            pergunta.innerHTML = `Qual foi a equipe campeã do primeiro Worlds de Lol?`
            op1.innerHTML = `SKT`;
            op2.innerHTML = `Fnatic`;
            op3.innerHTML = `EDG`;
            op4.innerHTML = `Team Liquid`;
        } else if (indice == 3) {
            titulo_pergunta.innerHTML = `Pergunta ${indice}`
            pergunta.innerHTML = `Qual foi a equipe campeã do segundo Worlds de Lol?`
            op1.innerHTML = `paiN`;
            op2.innerHTML = `Loud`;
            op3.innerHTML = `SKT`;
            op4.innerHTML = `Rogue`;
        }
    }

    function responder() {
        if(selecionado1 == false && selecionado2 == false && selecionado3 == false && selecionado4 == false){
            alert(`Selecione uma resposta`)
        }else{
        op1.style.opacity = '100%'
        op2.style.opacity = '100%'
        op3.style.opacity = '100%'
        op4.style.opacity = '100%'
        selecionado1 = false;
        selecionado2 = false;
        selecionado3 = false;
        selecionado4 = false;
        if(indice == 1){
            op3.style.border = '3px solid green'
        }
        indice++;
        setInterval(trocar,2000);
    }
    }
    function selecionar1() {
        if (selecionado1) {
            op2.style.opacity = '100%'
            op3.style.opacity = '100%'
            op4.style.opacity = '100%'
            selecionado1 = false;
        } else {
            op2.style.opacity = '30%'
            op3.style.opacity = '30%'
            op4.style.opacity = '30%'
            selecionado1 = true;
        }

    }
    function selecionar2() {
        if (selecionado2) {
            op1.style.opacity = '100%'
            op3.style.opacity = '100%'
            op4.style.opacity = '100%'
            selecionado2 = false;
        } else {
            op1.style.opacity = '30%'
            op3.style.opacity = '30%'
            op4.style.opacity = '30%'
            selecionado2 = true;
        }

    }
    function selecionar3() {
        if (selecionado3) {
            op2.style.opacity = '100%'
            op1.style.opacity = '100%'
            op4.style.opacity = '100%'
            selecionado3 = false;
        } else {
            op2.style.opacity = '30%'
            op1.style.opacity = '30%'
            op4.style.opacity = '30%'
            selecionado3 = true;
        }

    }
    function selecionar4() {
        if (selecionado4) {
            op2.style.opacity = '100%'
            op3.style.opacity = '100%'
            op1.style.opacity = '100%'
            selecionado4 = false;
        } else {
            op2.style.opacity = '30%'
            op3.style.opacity = '30%'
            op1.style.opacity = '30%'
            selecionado4 = true;
        }
    }
</script>
